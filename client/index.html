<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="description" content="cout - Minimalist real-time chat with code block syntax highlighting" />
  <title>cout | Real-Time Chat</title>
  
  <!-- Terminal Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230d1117%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 font-family=%22monospace%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22%2358a6ff%22>&gt;_</text></svg>" />

  <!-- Highlight.js for standard code syntax coloring (Atom One Dark theme) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- Socket.io Client -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <!-- Client Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="app-container">

    <!-- JOIN ROOM OVERLAY / MODAL -->
    <div id="join-screen" class="join-screen">
      <div class="join-card">
        <div class="brand-header">
          <div class="logo-mark">
            <span class="prompt-sym">&gt;</span>
          </div>
          <h1>cout</h1>
          <p class="tagline">Minimalist real-time chat with clean code formatting</p>
        </div>

        <form id="join-form" class="join-form" onsubmit="event.preventDefault(); return false;">
          <div class="input-group">
            <label for="username-input">Handle / Username</label>
            <input 
              type="text" 
              id="username-input" 
              placeholder="e.g. dev_alex" 
              maxlength="24" 
              autocomplete="off"
              required 
            />
          </div>

          <div class="input-group">
            <label for="room-input">Room Channel</label>
            <div class="room-prefix-wrap">
              <span class="room-hash">#</span>
              <input 
                type="text" 
                id="room-input" 
                placeholder="general" 
                value="general" 
                maxlength="24" 
                autocomplete="off"
              />
            </div>
          </div>

          <button type="submit" class="btn-primary" id="join-btn">
            Enter Room
          </button>
        </form>

        <div class="join-footer">
          <button id="server-settings-toggle" class="btn-text-link">Server Settings</button>
          <div id="server-settings-box" class="server-settings-box hidden">
            <label for="custom-server-input">Backend Server URL:</label>
            <input 
              type="url" 
              id="custom-server-input" 
              placeholder="https://your-server.onrender.com" 
            />
            <button id="save-server-btn" class="btn-secondary btn-small">Save URL</button>
          </div>
        </div>
      </div>
    </div>

    <!-- MAIN CHAT INTERFACE -->
    <div id="chat-screen" class="chat-screen hidden">
      
      <!-- Top Navigation Bar -->
      <header class="chat-header">
        <div class="header-left">
          <div class="header-brand">
            <span class="prompt-sym">&gt;</span>
            <span class="brand-title">cout</span>
          </div>
          <span class="header-divider">/</span>
          <div class="header-room">
            <span class="room-hash">#</span>
            <span id="header-room-name">general</span>
            <button id="copy-room-link-btn" class="btn-icon-tiny" title="Copy invite link to this room">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
              </svg>
            </button>
          </div>
        </div>

        <div class="header-right">
          <!-- Connection Status Pill -->
          <div id="connection-status" class="status-pill status-connecting" title="Socket status">
            <span class="status-dot"></span>
            <span class="status-text">Connecting</span>
          </div>

          <!-- Active Users Count & Toggle -->
          <button id="users-toggle-btn" class="btn-ghost" title="View active room members">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span id="active-user-count">1</span>
          </button>

          <!-- Sound Toggle Button -->
          <button id="sound-toggle-btn" class="btn-ghost" title="Toggle message sound">
            <svg id="sound-icon-on" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <svg id="sound-icon-off" class="hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>

          <!-- Leave Room Button -->
          <button id="leave-room-btn" class="btn-ghost" title="Leave room">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </header>

      <!-- Active Users Drawer/Flyout -->
      <aside id="users-sidebar" class="users-sidebar hidden">
        <div class="sidebar-header">
          <h3>Members in Room</h3>
          <button id="close-users-sidebar" class="btn-icon">&times;</button>
        </div>
        <ul id="users-list" class="users-list">
          <!-- Populated dynamically via JS -->
        </ul>
      </aside>

      <!-- Chat Messages Scroll Area -->
      <main id="chat-messages" class="chat-messages">
        <div class="welcome-banner">
          <p class="welcome-title">Connected to #<span id="welcome-room-name">general</span></p>
          <p class="welcome-desc">Messages are ephemeral. Tip: write code snippets using <code>```python</code>, <code>```javascript</code>, etc.</p>
        </div>
        <!-- Messages rendered here -->
      </main>

      <!-- Typing Indicator Row -->
      <div id="typing-indicator" class="typing-indicator hidden">
        <span class="typing-text">Someone is typing...</span>
      </div>

      <!-- Message Input Footer -->
      <footer class="chat-footer">
        <form id="message-form" class="message-form" onsubmit="event.preventDefault(); return false;">
          <!-- 4x3 Language Picker Popover (Left-anchored) -->
          <div id="code-lang-picker" class="code-lang-picker hidden">
            <div class="lang-picker-header">
              <span class="lang-picker-title">Select Language</span>
              <button type="button" id="close-lang-picker" class="btn-picker-close" title="Close">&times;</button>
            </div>
            <div class="lang-grid">
              <!-- Row 1: python, c, cpp, java -->

              </button>

                  <path fill="#f05138" d="M85 96.5c-11.11 6.13-26.38 6.76-41.75.47A64.53 64.53 0 0113.84 73a50 50 0 0010.85 6.32c15.87 7.1 31.73 6.61 42.9 0-15.9-11.66-29.4-26.82-39.46-39.2a43.47 43.47 0 01-5.29-6.82c12.16 10.61 31.5 24 38.38 27.79a271.77 271.77 0 01-27-32.34 266.8 266.8 0 0044.47 34.87c.71.38 1.26.7 1.7 1a32.7 32.7 0 001.21-3.51c3.71-12.89-.53-27.54-9.79-39.67C93.25 33.81 106 57.05 100.66 76.51c-.14.53-.29 1-.45 1.55l.19.22c10.59 12.63 7.68 26 6.35 23.5C101 91 90.37 94.33 85 96.5z"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="button" id="code-snippet-btn" class="btn-code-trigger" title="Insert code block">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 18 22 12 16 6"></polyline>
              <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
          </button>
          <div class="input-wrapper">
            <textarea 
              id="message-input" 
              rows="1" 
              placeholder="Message #general... (Shift+Enter for newline)"
              autocomplete="off"
            ></textarea>
          </div>
          <button type="button" id="send-btn" class="btn-send" title="Send message (Enter)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
      </footer>

    </div>

  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
